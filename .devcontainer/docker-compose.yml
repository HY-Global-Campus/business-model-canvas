services:
  dev:
    image: mcr.microsoft.com/devcontainers/javascript-node:20-bookworm
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  app:
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
      MOOC_REDIRECT_URI: http://localhost:5173/auth/callback

  frontend:
    command:
      - sh
      - -c
      - npm run dev -- --host 0.0.0.0 --port ${PORT:-5173} --strictPort
